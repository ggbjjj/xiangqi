<text x="1315.0" y="717.5" fill="#172D3A" font-size="20" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">历史注意力 ×2 + 空间注意力 ×2 + 交叉注意力 ×1</text>
<text x="1315.0" y="746.5" fill="#172D3A" font-size="20" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">4 头；D=128；FFN 128→512→128；KV 窗口 30</text>
