<title>HaiKu-5 / 加入残差 Dropout 后的完整网络</title><desc>默认 D=128，4 头，3 个独立核心；每核心 10 个 Dropout，全网 30 个，p=0.1</desc>
<rect width="1800" height="1590" fill="white"/>
