<text x="1315.0" y="939.5" fill="#172D3A" font-size="20" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">每个起点预测 90 个终点 → [B,90,90]</text>
