<text x="1315.0" y="1088.0" fill="#285AA8" font-size="24" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="central">Flatten → 8100 动作 logits</text>
<text x="1315.0" y="1117.0" fill="#172D3A" font-size="20" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">合法动作屏蔽 → 全动作 Softmax → 落子概率</text>
<polyline points="1315.0,980 1315.0,1045" fill="none" stroke="#285AA8" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="1315.0,1045 1320.0,1034.0 1310.0,1034.0" fill="#285AA8"/>
<rect x="80" y="1220" width="1560" height="125" rx="10" fill="#FCF5E9" stroke="#9B671D" stroke-width="2"/>
<text x="860.0" y="1253.5" fill="#9B671D" font-size="24" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="central">每个 Block 的两条残差分支</text>
<text x="860.0" y="1282.5" fill="#172D3A" font-size="20" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">h = LN1(X + Dropout(GELU(AttentionOutput)))</text>
<text x="860.0" y="1311.5" fill="#172D3A" font-size="20" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">输出 = LN2(h + Dropout(Linear2(GELU(Linear1(h)))))</text>
<polyline points="64,1468 1736,1468" fill="none" stroke="#D8E1E6" stroke-width="1" stroke-linejoin="round"/>
<text x="66" y="1495" fill="#566A75" font-size="19" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="start" dominant-baseline="central">每个核心独立 β、历史 KV 缓存及参数；共享 CNN 和位置编码只执行一次。详细逐层结构见子架构图。</text>
<text x="66" y="1525" fill="#566A75" font-size="19" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="start" dominant-baseline="central">监督训练启用 Dropout；验证、对弈及含有效 PPO 的逻辑批量关闭。Dropout 无参数，旧权重可严格加载。</text>
<text x="66" y="1555" fill="#566A75" font-size="19" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="start" dominant-baseline="central">依据 models/HaiKu/network.py 与 models/common.py；默认参数量仍为 3,043,614。</text>
</svg>