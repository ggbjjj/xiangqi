<text x="1315.0" y="516.5" fill="#172D3A" font-size="20" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">4 头；D=128；FFN 128→512→128；KV 窗口 30</text>
<polyline points="1315.0,335 1315.0,410" fill="none" stroke="#137C75" stroke-width="2.5" stroke-linejoin="round"/>
