[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xiangqi-desktop"
version = "1.0.0"
description = "支持双人、人机和 AI 观战的中国象棋"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["pygame-ce>=2.5,<3", "numpy>=1.26,<3"]

[project.optional-dependencies]
neural = ["torch>=2.6,<3"]

[project.scripts]
xiangqi = "main:main"
xiangqi-train = "train:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.setuptools]
py-modules = ["main", "ui", "game", "board", "piece", "constants", "ai", "mcts", "net", "encoder", "train"]

[tool.pytest.ini_options]
testpaths = ["tests", "test_game.py", "test_smoke.py"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
