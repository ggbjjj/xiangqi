<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1800" viewBox="0 0 1600 900" role="img">
<title>策略头与价值头 · 如何共同决定走法</title><desc>p 分配搜索方向，v 评价局面；MCTS 综合两者形成搜索后的走法分布 π</desc>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="68" y="64" fill="#172D3A" font-size="42" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700" text-anchor="start" dominant-baseline="central">策略头与价值头 · 如何共同决定走法</text>
<text x="70" y="116" fill="#566A75" font-size="22" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="start" dominant-baseline="central">p 分配搜索方向，v 评价局面；MCTS 综合两者形成搜索后的走法分布 π</text>
<rect x="70" y="195" width="420" height="180" rx="14" fill="#EAF6F3" stroke="#137C75" stroke-width="2"/>
<text x="280.0" y="241.5" fill="#137C75" font-size="26" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="central">同一个局面 s</text>
<text x="280.0" y="275.5" fill="#172D3A" font-size="21" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">输入：15 × 10 × 9</text>
<text x="280.0" y="304.5" fill="#172D3A" font-size="21" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">卷积与残差主干提取共享特征</text>
<text x="280.0" y="333.5" fill="#172D3A" font-size="21" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">随后进入两个输出分支</text>
<rect x="590" y="170" width="940" height="110" rx="14" fill="#EDF3FC" stroke="#285AA8" stroke-width="2"/>
<text x="1060.0" y="196.0" fill="#285AA8" font-size="26" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="central">策略头：哪些动作值得优先搜索？</text>
<text x="1060.0" y="230.0" fill="#172D3A" font-size="21" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">8100 个 logits → 合法掩码 + Softmax → p(a|s)</text>
<text x="1060.0" y="259.0" fill="#172D3A" font-size="21" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">p 是动作之间的概率分配，不是每个动作的获胜概率</text>
<rect x="590" y="325" width="940" height="110" rx="14" fill="#F3EFFA" stroke="#7751A7" stroke-width="2"/>
<text x="1060.0" y="351.0" fill="#7751A7" font-size="26" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="central">价值头：这个局面对当前走方有多有利？</text>
<text x="1060.0" y="385.0" fill="#172D3A" font-size="21" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">每个局面只输出一个 v(s) ∈ [−1, 1]，预测最终胜负得分</text>
<text x="1060.0" y="414.0" fill="#172D3A" font-size="21" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">评价候选走法时，要先试走到后续局面，再调用价值头</text>
<polyline points="490,285 540,285 540,225 590,225" fill="none" stroke="#285AA8" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="590,225 579.0,220.0 579.0,230.0" fill="#285AA8"/>
<polyline points="540,285 540,380 590,380" fill="none" stroke="#7751A7" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="590,380 579.0,375.0 579.0,385.0" fill="#7751A7"/>
<text x="70" y="477" fill="#137C75" font-size="24" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700" text-anchor="start" dominant-baseline="central">MCTS 的一次模拟；下面的过程重复多次</text>
<rect x="70" y="515" width="320" height="108" rx="14" fill="#EAF6F3" stroke="#137C75" stroke-width="2"/>
<text x="230.0" y="540.0" fill="#137C75" font-size="25" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="central">① 选择分支</text>
<text x="230.0" y="574.0" fill="#172D3A" font-size="20" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">结合 p、平均价值 Q</text>
<text x="230.0" y="603.0" fill="#172D3A" font-size="20" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">以及访问次数 N</text>
<rect x="450" y="515" width="320" height="108" rx="14" fill="#EAF6F3" stroke="#137C75" stroke-width="2"/>
<text x="610.0" y="540.0" fill="#137C75" font-size="25" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="central">② 走到叶子局面</text>
<text x="610.0" y="574.0" fill="#172D3A" font-size="20" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">沿搜索树模拟走子</text>
<text x="610.0" y="603.0" fill="#172D3A" font-size="20" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">尚未结束时调用网络</text>
<rect x="830" y="515" width="320" height="108" rx="14" fill="#EAF6F3" stroke="#137C75" stroke-width="2"/>
<text x="990.0" y="540.0" fill="#137C75" font-size="25" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="central">③ 评价叶子</text>
<text x="990.0" y="574.0" fill="#172D3A" font-size="20" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">使用价值头预测 v</text>
<text x="990.0" y="603.0" fill="#172D3A" font-size="20" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">终局直接使用胜负结果</text>
<rect x="1210" y="515" width="320" height="108" rx="14" fill="#EAF6F3" stroke="#137C75" stroke-width="2"/>
<text x="1370.0" y="540.0" fill="#137C75" font-size="25" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="central">④ 向上回传</text>
<text x="1370.0" y="574.0" fill="#172D3A" font-size="20" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">双方视角逐层翻转符号</text>
<text x="1370.0" y="603.0" fill="#172D3A" font-size="20" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">累计价值与访问次数</text>
<polyline points="390,569 450,569" fill="none" stroke="#137C75" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="450,569 439.0,564.0 439.0,574.0" fill="#137C75"/>
<polyline points="770,569 830,569" fill="none" stroke="#137C75" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="830,569 819.0,564.0 819.0,574.0" fill="#137C75"/>
<polyline points="1150,569 1210,569" fill="none" stroke="#137C75" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="1210,569 1199.0,564.0 1199.0,574.0" fill="#137C75"/>
<text x="150" y="677" fill="#172D3A" font-size="21" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="central">走法</text>
<text x="490" y="677" fill="#172D3A" font-size="21" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="central">搜索前先验 p</text>
<text x="900" y="677" fill="#172D3A" font-size="21" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="central">搜索访问次数 N</text>
<text x="1330" y="677" fill="#172D3A" font-size="21" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="central">训练目标 π = N / ΣN</text>
<polyline points="70,700 1530,700" fill="none" stroke="#9DADB6" stroke-width="1" stroke-linejoin="round"/>
<text x="150" y="724" fill="#172D3A" font-size="22" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">A</text>
<text x="490" y="724" fill="#172D3A" font-size="22" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">55%</text>
<text x="900" y="724" fill="#172D3A" font-size="22" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">40</text>
<text x="1330" y="724" fill="#172D3A" font-size="22" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">20%</text>
<text x="150" y="758" fill="#285AA8" font-size="22" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">B</text>
<text x="490" y="758" fill="#285AA8" font-size="22" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">30%</text>
<text x="900" y="758" fill="#285AA8" font-size="22" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">140</text>
<text x="1330" y="758" fill="#285AA8" font-size="22" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">70%</text>
<text x="150" y="792" fill="#172D3A" font-size="22" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">C</text>
<text x="490" y="792" fill="#172D3A" font-size="22" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">15%</text>
<text x="900" y="792" fill="#172D3A" font-size="22" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">20</text>
<text x="1330" y="792" fill="#172D3A" font-size="22" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="middle" dominant-baseline="central">10%</text>
<polyline points="70,843 1530,843" fill="none" stroke="#D8E1E6" stroke-width="1" stroke-linejoin="round"/>
<text x="70" y="870" fill="#566A75" font-size="18" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400" text-anchor="start" dominant-baseline="central">表中为教学示例，非项目实测：200 次模拟后 B 被访问最多。网络先验 p 与搜索分布 π 可以不同；后者用于自对弈策略训练。</text>
</svg>